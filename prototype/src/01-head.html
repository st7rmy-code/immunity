<title>Иммунитет к мошенникам</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: спокойный «клинический» интерфейс: светлые поверхности, глубокий зелёный как знак защиты, тёмный телефон-тренажёр в центре сцены; крупный режим для пожилых */
:root{
  --bg:#F1F3F2; --surface:#FFFFFF; --surface-2:#F7F8F7; --sunk:#E9EDEB; --ink:#111715; --muted:#55605B; --faint:#89928D; --line:#DFE4E1; --line-2:#C9D0CC;
  --accent:#0E6B4C; --accent-hi:#0A5A3F; --accent-ink:#FFFFFF; --accent-soft:#E0EFE8;
  --ok:#11804F; --ok-soft:#E0F2E9; --bad:#C3302D; --bad-soft:#FAE7E6; --warn:#9A6408; --warn-soft:#F8EED9;
  --phone:#0D1210; --phone-2:#1A221F; --phone-3:#252E2A; --phone-ink:#EEF3F0; --phone-muted:#93A09A;
  --shadow:0 1px 2px rgba(17,23,21,.05),0 10px 30px rgba(17,23,21,.07);
  --viz-before:#6250d6; --viz-after:#11804F; --viz-up:#C3302D; --viz-down:#2a78d6; --viz-roc:#2a78d6;
  --f:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0F0D; --surface:#121816; --surface-2:#171E1B; --sunk:#0E1311; --ink:#E7EDEA; --muted:#9AA6A0; --faint:#68736D; --line:#212926; --line-2:#2E3834;
  --accent:#3FBE8B; --accent-hi:#5ACF9F; --accent-ink:#05130D; --accent-soft:rgba(63,190,139,.13);
  --ok:#3FBE8B; --ok-soft:rgba(63,190,139,.13); --bad:#F06C66; --bad-soft:rgba(240,108,102,.13); --warn:#E2AE4C; --warn-soft:rgba(226,174,76,.13);
  --phone:#050807; --phone-2:#141A18; --phone-3:#1F2724; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45); --viz-before:#9085e9; --viz-after:#29A06D; --viz-up:#E2564F; --viz-down:#3987e5; --viz-roc:#3987e5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F0D; --surface:#121816; --surface-2:#171E1B; --sunk:#0E1311; --ink:#E7EDEA; --muted:#9AA6A0; --faint:#68736D; --line:#212926; --line-2:#2E3834;
  --accent:#3FBE8B; --accent-hi:#5ACF9F; --accent-ink:#05130D; --accent-soft:rgba(63,190,139,.13);
  --ok:#3FBE8B; --ok-soft:rgba(63,190,139,.13); --bad:#F06C66; --bad-soft:rgba(240,108,102,.13); --warn:#E2AE4C; --warn-soft:rgba(226,174,76,.13);
  --phone:#050807; --phone-2:#141A18; --phone-3:#1F2724; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 34px rgba(0,0,0,.45); --viz-before:#9085e9; --viz-after:#29A06D; --viz-up:#E2564F; --viz-down:#3987e5; --viz-roc:#3987e5; color-scheme:dark}
html{font-size:15px}
html.large{font-size:18.5px}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance;line-height:1.25}
h1{font-size:2rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0} a{color:var(--accent)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.86rem} .tiny{font-size:.78rem}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* шапка */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0;flex:0 0 auto;font-family:var(--f)}
.logo .wm{font-weight:700;font-size:.95rem;letter-spacing:.2em}
.logo .sub{display:block;font-size:.68rem;letter-spacing:.02em;color:var(--muted);font-weight:500;margin-top:-1px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--muted);font:500 .95rem var(--f);padding:0 12px;height:60px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:500 .85rem var(--f);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip b{font-family:var(--m);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
@media (max-width:1080px){.hdr-in{flex-wrap:wrap;gap:4px 12px;padding-top:8px}nav.tabs{order:3;flex:1 1 100%;margin:0 -8px}nav.tabs button{height:44px}.tools{margin-left:auto}}
@media (max-width:440px){.logo .sub{display:none}#idxChip .lbl{display:none}}

.wrap{max-width:1240px;margin:0 auto;padding-block:20px 100px}
section.tab{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;display:grid;gap:14px;align-content:start}
.card.flat{background:var(--surface-2)}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:grid;gap:10px;align-content:start;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:440px){.g4{grid-template-columns:minmax(0,1fr)}}

.btn{font:600 .95rem var(--f);border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:0 16px;min-height:42px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:none}
.btn.sm{min-height:34px;font-size:.86rem;padding:0 12px;border-radius:8px}
.btn.wrap{white-space:normal;text-align:left;justify-content:flex-start;padding-block:9px;line-height:1.35}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible,.seg button:focus-visible,.chip:focus-visible,.q:focus-visible,.aud:focus-visible,.scen:focus-visible,.logo:focus-visible,.round:focus-visible,.qr:focus-visible,.fchip:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;max-width:100%;overflow-x:auto}
.seg button{font:600 .9rem var(--f);border:0;border-radius:7px;background:none;color:var(--muted);padding:0 14px;min-height:34px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fchip{font:500 .85rem var(--f);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
label{font-size:.86rem;color:var(--muted);display:grid;gap:6px}
input,select,textarea{font:400 1rem var(--f);color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:0 12px;min-height:42px;width:100%;min-width:0}
textarea{padding:10px 12px;line-height:1.5;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input[type="range"]{padding:0;min-height:28px;accent-color:var(--accent);border:0;background:none}
input[type="color"]{padding:2px;width:52px;min-height:38px}
.q{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);background:none;color:var(--muted);font:600 .72rem var(--f);cursor:pointer;padding:0;flex:0 0 auto}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.acc{background:var(--accent-soft);color:var(--accent)}
.verdict{border-radius:12px;padding:14px 16px;border:1px solid var(--line);border-left-width:4px;background:var(--surface-2);display:grid;gap:6px}
.verdict.ok{border-left-color:var(--ok)} .verdict.bad{border-left-color:var(--bad)} .verdict.warn{border-left-color:var(--warn)}
.verdict b{font-size:1.05rem}
ul.clean{margin:0;padding-left:18px;display:grid;gap:5px}
.sw{position:relative;width:44px;height:26px;border-radius:999px;border:0;background:var(--line-2);cursor:pointer;flex:0 0 auto;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}

/* главная */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px}
.hero h1{font-size:2.2rem;line-height:1.15}
.hero p.lead{font-size:1.08rem;color:var(--muted);max-width:56ch}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);padding:20px}.hero h1{font-size:1.7rem}}
.auds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.aud{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink);font-family:var(--f)}
.aud b{font-size:1.05rem} .aud span{font-size:.8rem;color:var(--muted)}
.aud[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.idx{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font:600 2.2rem var(--f);line-height:1;letter-spacing:-.02em}
.ring .val span{display:block;font-size:.72rem;color:var(--muted)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:.86rem}
.bar .tr{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:-4px}
.bar .tr i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar .v{text-align:right;font-family:var(--m);color:var(--muted)}
@media (max-width:480px){.idx{grid-template-columns:minmax(0,1fr)}.ring{margin:0 auto}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fact{border-top:3px solid var(--accent);padding-top:10px;display:grid;gap:4px;align-content:start}
.fact b{font:600 1.7rem var(--f);letter-spacing:-.02em}
.fact a{font-size:.75rem;color:var(--faint)}
@media (max-width:980px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.facts{grid-template-columns:minmax(0,1fr)}}

/* тренировки */
.scens{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scen{display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;color:var(--ink);font-family:var(--f);align-content:start}
.scen:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.scen b{font-size:1rem;line-height:1.3}
.scen .who{font-size:.82rem;color:var(--muted)}
.scen .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.stagegrid{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.stagegrid{grid-template-columns:minmax(0,1fr)}}
.side{position:sticky;top:80px}
@media (max-width:820px){.side{position:static}}

/* телефон */
.phone{width:100%;max-width:380px;margin:0 auto;height:680px;border-radius:40px;background:var(--phone);color:var(--phone-ink);padding:12px;border:1px solid var(--line-2);box-shadow:var(--shadow),inset 0 0 0 2px #2A322F;display:flex;flex-direction:column;position:relative;overflow:hidden}
html.large .phone{height:760px}
.ph-status{display:flex;justify-content:space-between;font:500 .75rem var(--m);color:var(--phone-muted);padding:4px 16px 8px}
.ph-screen{flex:1;display:flex;flex-direction:column;min-height:0;border-radius:30px;background:var(--phone);position:relative}
.incoming{flex:1;display:grid;grid-template-rows:auto 1fr auto;padding:28px 18px 26px;text-align:center}
.avatar{width:84px;height:84px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center;font:600 2rem var(--f);background:var(--phone-3);color:var(--phone-ink)}
.callname{font-size:1.45rem;font-weight:600;line-height:1.2}
.callnum{font:500 .95rem var(--m);color:var(--phone-muted);margin-top:4px}
.calllabel{display:inline-block;margin-top:10px;font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--phone-3);color:#F3C76B}
.calllabel.okl{color:#7BE0B2}
.coachline{font-size:.86rem;color:var(--phone-muted);margin:14px auto 0;max-width:30ch}
.callbtns{display:flex;justify-content:space-around;align-items:end}
.round{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#fff;font:600 .78rem var(--f)}
.round.green{background:#22B86D} .round.red{background:#E5484D}
.round svg{width:30px;height:30px}
.rlbl{font-size:.78rem;color:var(--phone-muted);margin-top:6px;text-align:center}
.talkhead{text-align:center;padding:6px 0 10px;border-bottom:1px solid var(--phone-3)}
.talkhead .callname{font-size:1.05rem}
.talkhead .callnum{font-size:.8rem}
.trn{flex:1;overflow-y:auto;padding:12px 6px;display:flex;flex-direction:column;gap:8px;min-height:0}
.bub{max-width:88%;padding:9px 12px;border-radius:16px;font-size:.92rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.them{background:var(--phone-2);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:#2E7D5B;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bub.sys{align-self:center;background:none;color:var(--phone-muted);font-size:.78rem;text-align:center;padding:2px 8px}
.bub .who{display:block;font-size:.72rem;color:var(--phone-muted);margin-bottom:2px}
.typing{color:var(--phone-muted);font-style:italic}
.smsbox{position:absolute;left:8px;right:8px;top:8px;z-index:3}
.sms{background:rgba(245,247,246,.97);color:#111;border-radius:16px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:grid;gap:2px;font-size:.86rem;cursor:pointer;animation:drop .25s ease-out}
.sms b{font-size:.78rem;color:#555}
@keyframes drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.qrs{display:flex;flex-wrap:wrap;gap:6px;padding:6px 2px;max-height:184px;overflow-y:auto;scrollbar-width:thin}
.qrs::-webkit-scrollbar{display:none}
.qr{flex:0 1 auto;font:500 .8rem var(--f);background:var(--phone-2);color:var(--phone-ink);border:1px solid var(--phone-3);border-radius:14px;padding:6px 11px;cursor:pointer;text-align:left;line-height:1.3}
.qr:disabled{opacity:.5;cursor:default}
.qr.danger{color:#FF9C97;border-color:#5A2A28}
.ph-form{display:flex;gap:6px;padding:4px 2px}
.ph-form input{background:var(--phone-2);border-color:var(--phone-3);color:var(--phone-ink);border-radius:999px;min-height:40px;font-size:.92rem}
.ph-form button{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:0;background:#2E7D5B;color:#fff;cursor:pointer;font-size:1.1rem}
.callbar{display:flex;align-items:flex-start;justify-content:center;gap:8px;padding:10px 0 6px}
.minibtn{display:grid;justify-items:center;gap:4px;background:none;border:0;color:var(--phone-ink);cursor:pointer;font:500 .72rem var(--f);width:76px;text-align:center;line-height:1.25}
.minibtn.on span.c{background:#2E7D5B;color:#fff}
.ph-form .mic{display:grid;place-items:center;background:var(--phone-3);color:var(--phone-ink)}
.ph-form .mic svg{width:18px;height:18px}
.ph-form .mic.on{background:#E5484D;color:#fff;animation:micp 1.2s ease-in-out infinite}
.ph-form button:disabled{opacity:.45;cursor:not-allowed}
@keyframes micp{50%{box-shadow:0 0 0 7px rgba(229,72,77,.28)}}
.minibtn span.c{width:48px;height:48px;border-radius:50%;background:var(--phone-3);display:grid;place-items:center}
.minibtn.danger span.c{background:#3A1E1D;color:#FF9C97}
.minibtn svg{width:22px;height:22px}
.chathead{display:flex;align-items:center;gap:10px;padding:6px 8px 10px;border-bottom:1px solid var(--phone-3)}
.chathead .avatar{width:38px;height:38px;margin:0;font-size:1rem}
.chathead b{display:block;font-size:.95rem;line-height:1.2}
.chathead span{font-size:.75rem;color:var(--phone-muted)}
.endnote{flex:1;display:grid;place-items:center;text-align:center;padding:30px;color:var(--phone-muted);gap:10px}
.endnote b{color:var(--phone-ink);font-size:1.1rem;display:block}
.flagsl{display:grid;gap:6px}
.flagsl div{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:.9rem;align-items:start}
.flagsl div::before{content:"!";display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--bad-soft);color:var(--bad);font:700 .7rem var(--f);margin-top:2px}
.pressure{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.pressure i{display:block;height:100%;background:linear-gradient(90deg,var(--warn),var(--bad));transition:width .3s}

/* верю — не верю */
.swwrap{display:grid;gap:16px;max-width:620px;margin:0 auto;width:100%}
.swcard{border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.swhead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.swhead .avatar{width:36px;height:36px;margin:0;font-size:.95rem;background:var(--sunk);color:var(--ink)}
.swhead b{display:block;font-size:.95rem}
.swhead span{font-size:.78rem;color:var(--muted)}
.swbody{padding:18px 18px 20px;font-size:1.05rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}

/* схемы */

/* проверка */

/* защита */

/* организации */
