name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет устаревший прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: immunity, POSTGRES_PASSWORD: immunity_ci, POSTGRES_DB: immunity_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U immunity" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults: {run: {working-directory: backend}}
    env:
      IMMUNITY_TEST_DATABASE_URL: postgresql+psycopg://immunity:immunity_ci@localhost:5432/immunity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: pip install -r requirements.lock -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest
      - name: Схема БД в моделях совпадает с миграциями
        env:
          IMMUNITY_DATABASE_URL: postgresql+psycopg://immunity:immunity_ci@localhost:5432/immunity_test
          IMMUNITY_JWT_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
        run: alembic check
      - name: docs/openapi.json совпадает с кодом
        run: python -m app.openapi_export > /tmp/openapi.json && diff -u ../docs/openapi.json /tmp/openapi.json

  frontend:
    name: Frontend (типы, vitest, сборка, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: immunity, POSTGRES_PASSWORD: immunity_ci, POSTGRES_DB: immunity}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U immunity" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      IMMUNITY_DATABASE_URL: postgresql+psycopg://immunity:immunity_ci@localhost:5432/immunity
      IMMUNITY_JWT_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      IMMUNITY_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend для e2e
        working-directory: backend
        run: |
          pip install -r requirements.lock && pip install --no-deps -e .
          alembic upgrade head
          python -m app.seed.load
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
      - name: Типы, модульные тесты, сборка
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc -b --noEmit
          npm test
          npm run build
      - name: Сквозные тесты
        working-directory: frontend
        run: |
          (cd ../prototype && node build.mjs)
          npx playwright install --with-deps chromium
          nohup npx vite preview --port 4173 --strictPort > /tmp/web.log 2>&1 &
          ok=; for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/api/v1/health >/dev/null 2>&1 && ok=1 && break; sleep 1; done
          [ -n "$ok" ] || { echo "::error::preview или API не поднялись за 60 секунд"; exit 1; }
          npm run e2e
      - name: Логи серверов при ошибке
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/web.log || true

  prototype:
    name: Прототип (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, msedge]
    defaults: {run: {working-directory: prototype}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
        env: {PW_BROWSER: "${{ matrix.browser }}"}
      - name: Скриншоты и отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-${{ matrix.browser }}
          path: prototype/tests/out/*.png
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker Compose (сборка и запуск)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-db-password
      IMMUNITY_JWT_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      IMMUNITY_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и запуск
        run: docker compose -f infrastructure/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Проверка стека через nginx
        run: |
          curl -fsS http://localhost:8080/api/v1/health | tee /dev/stderr | grep -q '"db":true'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS -o /dev/null http://localhost:8080/audio/$(ls prototype/public/v | head -1)
          curl -fsS http://localhost:8080/prototype/ | grep -q 'Иммунитет'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/scenarios)" = 200
          curl -fsSI http://localhost:8080/ | grep -qi 'content-security-policy'
      - name: Логи при ошибке
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs --tail 100
      - name: Остановка
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down -v
