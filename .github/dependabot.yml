# Раз в неделю — предложения обновить зависимости. Мелкие обновления группируются в один pull request.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly, day: monday}
    groups: {python: {update-types: [minor, patch]}}
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly, day: monday}
    groups: {web: {update-types: [minor, patch]}}
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /prototype
    schedule: {interval: monthly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: monthly}
  - package-ecosystem: docker
    directory: /frontend
    schedule: {interval: monthly}
